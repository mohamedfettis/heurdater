<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTO Geotag - Horodatage Photo</title>
    <!-- piexifjs library for EXIF metadata -->
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #22c55e;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .custom-text-section {
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            background: #f1f5f9;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="text"]:disabled {
            background-color: #e2e8f0;
            cursor: not-allowed;
        }

        .custom-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
        }

        .custom-select:disabled {
            background-color: #e2e8f0;
            cursor: not-allowed;
        }

        .custom-time {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 10px;
        }

        .custom-time:disabled {
            background-color: #e2e8f0;
            cursor: not-allowed;
        }

        .hint {
            display: block;
            margin-top: 5px;
            color: var(--accent-color);
            font-size: 12px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            width: 100%;
            font-size: 16px;
        }

        .btn-upload {
            background-color: var(--primary-color);
            color: white;
            display: block;
        }

        .btn-upload:hover {
            background-color: #1d4ed8;
        }

        .btn-download {
            background-color: var(--success-color);
            color: white;
            margin-top: 15px;
            display: none;
        }

        .btn-download:hover {
            background-color: #16a34a;
        }

        .status {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            word-break: break-word;
        }

        .status.info {
            background-color: #dbeafe;
            color: #1e40af;
            display: block;
            border-left: 4px solid var(--primary-color);
        }

        .status.error {
            background-color: #fee2e2;
            color: #991b1b;
            display: block;
            border-left: 4px solid #ef4444;
        }

        .preview-container {
            margin-top: 20px;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            border: 1px solid #e2e8f0;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        input[type="file"] {
            display: none;
        }

        .debug-hint {
            margin-top: 20px;
            font-size: 12px;
            color: var(--accent-color);
            text-align: center;
        }

        .version {
            position: fixed;
            bottom: 5px;
            right: 5px;
            font-size: 10px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>PTO Geotag Pro</h1>

        <div class="upload-section">
            <div class="custom-text-section">
                <label class="toggle-container">
                    <input type="checkbox" id="enableCustomText" checked>
                    Ligne 1 Personnalisée
                </label>
                <select id="customText" class="custom-select">
                    <option value="PTO">PTO</option>
                    <option value="PTO - Point de Terminaison Optique">PTO - Point de Terminaison Optique</option>
                    <option value="MUR_AVANT">MUR_AVANT</option>
                    <option value="MUR_APRES">MUR_APRES</option>
                    <option value="DECHARGE">DECHARGE</option>
                    <option value="INSTALLATION">INSTALLATION</option>
                    <option value="MAINTENANCE">MAINTENANCE</option>
                    <option value="REPARATION">REPARATION</option>
                    <option value="VERIFICATION">VERIFICATION</option>
                    <option value="CONTROLE">CONTROLE</option>
                    <option value="AVANT TRAVAUX">AVANT TRAVAUX</option>
                    <option value="APRES TRAVAUX">APRES TRAVAUX</option>
                    <option value="EN COURS">EN COURS</option>
                    <option value="TERMINE">TERMINE</option>
                    <option value="FIBRE OPTIQUE">FIBRE OPTIQUE</option>
                    <option value="CABLE">CABLE</option>
                    <option value="ARMOIRE">ARMOIRE</option>
                    <option value="BOITIER">BOITIER</option>
                </select>
            </div>

            <div class="custom-text-section">
                <label class="toggle-container">
                    <input type="checkbox" id="enableCustomTime">
                    Modifier l'heure manuellement
                </label>
                <input type="time" id="customTime" class="custom-time" disabled step="1">
                <small class="hint">Laissez décoché pour utiliser l'heure actuelle</small>
            </div>

            <label for="imageInput" class="btn btn-upload">
                <span id="btnText">�️ Choisir une photo</span>
            </label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div id="statusMessage" class="status"></div>

        <div class="preview-container" id="previewContainer">
            <canvas id="mainCanvas"></canvas>
        </div>

        <button id="downloadBtn" class="btn btn-download">📥 Télécharger la photo</button>

        <div class="debug-hint">
            Autorisez la localisation pour obtenir l'adresse complète.
        </div>
    </div>

    <div class="version">v9.2 - EXIF ajouté</div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const customTextInput = document.getElementById('customText');
        const enableCustomText = document.getElementById('enableCustomText');
        const enableCustomTime = document.getElementById('enableCustomTime');
        const customTimeInput = document.getElementById('customTime');
        const statusMessage = document.getElementById('statusMessage');
        const downloadBtn = document.getElementById('downloadBtn');
        const mainCanvas = document.getElementById('mainCanvas');
        const previewContainer = document.getElementById('previewContainer');
        const btnText = document.getElementById('btnText');

        let fileName = "PTO_Photo.jpg";

        enableCustomText.addEventListener('change', (e) => {
            customTextInput.disabled = !e.target.checked;
        });

        enableCustomTime.addEventListener('change', (e) => {
            customTimeInput.disabled = !e.target.checked;
            if (e.target.checked && !customTimeInput.value) {
                // Set current time as default when enabled
                const now = new Date();
                customTimeInput.value = now.toTimeString().substring(0, 8);
            }
        });

        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            resetUI();
            showStatus("🔄 Initialisation du traitement...", "info");
            btnText.innerHTML = '<span class="loader"></span>Traitement...';

            const now = new Date();
            const dateStr = now.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });

            // Use custom time if enabled, otherwise use current time
            let timeStr;
            if (enableCustomTime.checked && customTimeInput.value) {
                timeStr = customTimeInput.value;
            } else {
                timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            let latitude = 0;
            let longitude = 0;
            let address = "Localisation non disponible";

            try {
                showStatus("📍 Récupération de la position GPS...", "info");
                const position = await getGPS();
                latitude = position.coords.latitude;
                longitude = position.coords.longitude;

                showStatus("🌍 Récupération de l'adresse...", "info");
                address = await getAddress(latitude, longitude);
            } catch (error) {
                console.error(error);
                showStatus("⚠️ GPS impossible: " + error.message + ". Traitement sans coordonnées.", "info");
            }

            try {
                showStatus("🎨 Génération de l'image...", "info");

                // Prepare Data
                const line1 = enableCustomText.checked ? customTextInput.value : "";
                const line2 = `${dateStr} ${timeStr}`;
                const line3 = latitude !== 0 ? `${latitude.toFixed(7)} ; ${longitude.toFixed(7)}` : "GPS non disponible";
                // line4 (address) is handled inside processImage for canvas, but we need it for overlay too

                // UPDATE PREVIEW OVERLAY
                let overlayHTML = "";
                if (line1) overlayHTML += `<div>${line1}</div>`;
                overlayHTML += `<div>${line2}</div>`;
                overlayHTML += `<div>${line3}</div>`;
                overlayHTML += `<div>${address}</div>`; // Note: Canvas truncates, CSS overlay wraps/expands.

                textOverlay.innerHTML = overlayHTML;
                previewContainer.style.display = "block";


                // PROCESS CANVAS IN BACKGROUND (FOR DOWNLOAD)
                await processImage(file, {
                    line1: line1,
                    line2: line2,
                    line3: line3,
                    line4: address
                });

                // Store GPS and datetime for EXIF metadata
                capturedLatitude = latitude;
                capturedLongitude = longitude;
                // Convert to EXIF datetime format: "YYYY:MM:DD HH:MM:SS"
                const exifDate = now.toISOString().slice(0, 19).replace('T', ' ').replace(/-/g, ':');
                capturedDateTime = exifDate;

                const ts = dateStr.replaceAll('/', '-') + "_" + timeStr.replaceAll(':', '-');
                fileName = `PTO_${ts}.jpg`;

                showStatus("✅ Photo traitée avec succès !", "info");
                downloadBtn.style.display = "block";
                btnText.textContent = "� Choisir une autre photo";
            } catch (error) {
                console.error(error);
                showStatus("❌ Erreur critique : " + error.message, "error");
                btnText.textContent = "🔄 Réessayer";
            }
        });

        function showStatus(text, type) {
            statusMessage.textContent = text;
            statusMessage.className = `status ${type}`;
            statusMessage.style.display = "block";
        }

        function resetUI() {
            statusMessage.style.display = "none";
            downloadBtn.style.display = "none";
            previewContainer.style.display = "none";
            textOverlay.innerHTML = ""; // Clear overlay
        }

        function getGPS() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    return reject(new Error("Géolocalisation non supportée par votre navigateur"));
                }

                // Show helpful message
                console.log("Demande de géolocalisation en cours...");

                navigator.geolocation.getCurrentPosition(resolve, (err) => {
                    let msg = "Erreur inconnue";
                    switch (err.code) {
                        case err.PERMISSION_DENIED:
                            msg = "Vous devez autoriser la localisation dans les paramètres du navigateur";
                            break;
                        case err.POSITION_UNAVAILABLE:
                            msg = "Position GPS indisponible (activez le GPS sur votre téléphone)";
                            break;
                        case err.TIMEOUT:
                            msg = "Délai dépassé (vérifiez votre connexion GPS)";
                            break;
                    }
                    reject(new Error(msg));
                }, {
                    enableHighAccuracy: true,
                    timeout: 15000,  // Increased to 15 seconds for mobile
                    maximumAge: 5000  // Allow cached position up to 5 seconds old
                });
            });
        }

        async function getAddress(lat, lon) {
            if (lat === 0 && lon === 0) return "Adresse non disponible";
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=jsonv2&zoom=18`, {
                    headers: { 'Accept-Language': 'fr' }
                });
                if (!response.ok) throw new Error("API non accessible");
                const data = await response.json();

                const addr = data.address || {};
                const parts = [];

                if (addr.house_number) parts.push(addr.house_number);
                if (addr.road) parts.push(addr.road);
                if (addr.postcode) parts.push(addr.postcode);
                if (addr.city || addr.town || addr.village) parts.push(addr.city || addr.town || addr.village);

                return parts.length > 0 ? parts.join(' ') : (data.display_name || "Adresse inconnue");
            } catch (error) {
                return "Adresse non disponible";
            }
        }

        function processImage(file, data) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("Erreur de lecture du fichier"));
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const ctx = mainCanvas.getContext('2d');

                        // HYBRID RESOLUTION LOGIC:
                        // 1. If image is SMALL (< 2048px wide): Upscale to 2048px (fixes pixelated text).
                        // 2. If image is LARGE (>= 2048px wide): Keep native resolution (preserves photo quality).
                        const MIN_WIDTH = 2048;
                        let finalWidth = img.width;
                        let finalHeight = img.height;

                        if (img.width < MIN_WIDTH) {
                            const scaleFactor = MIN_WIDTH / img.width;
                            finalWidth = MIN_WIDTH;
                            finalHeight = img.height * scaleFactor;
                        }

                        // Set canvas dimensions
                        mainCanvas.width = finalWidth;
                        mainCanvas.height = finalHeight;

                        // Draw image (scaled or original)
                        // Use high quality interpolation for upscaling
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);

                        // EXACT MATCH to reference image "MUR_APRES"
                        // Font size: 2.7% of HEIGHT (Dynamic Rule of 3 - works for both Upscaled and Native)
                        const baseFontSize = Math.round(mainCanvas.height * 0.027);
                        // Very tight line spacing: 1.05x (measured from reference)
                        const lineHeight = baseFontSize * 1.05;
                        // Left padding: very close to edge (~1.2% of width)
                        const leftPadding = Math.round(mainCanvas.width * 0.012);
                        // Bottom padding: small margin from bottom (~1% of height)
                        const bottomPadding = Math.round(mainCanvas.height * 0.01);

                        // Calculate text area height for exactly 4 lines
                        const numLines = 4;
                        const textAreaHeight = (lineHeight * numLines) + bottomPadding;

                        // NO BACKGROUND BOX - text directly on image (like reference)

                        // Enable high-quality text rendering
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';

                        // Text style: WHITE, BOLD (like reference "MUR_APRES")
                        ctx.fillStyle = "#FFFFFF";
                        ctx.font = `bold ${baseFontSize}px Arial, sans-serif`;
                        ctx.textAlign = "left";
                        ctx.textBaseline = "top";

                        // Black stroke (outline) - slightly thinner
                        ctx.strokeStyle = "#000000";
                        ctx.lineWidth = Math.max(2, baseFontSize * 0.09);  // Reduced outline thickness
                        ctx.lineJoin = "round";
                        ctx.miterLimit = 2;

                        const startY = img.height - textAreaHeight;


                        // Draw exactly 4 lines (matching reference layout)
                        // Use stroke first, then fill for better visibility
                        let currentY = startY;

                        if (data.line1) {
                            ctx.strokeText(data.line1, leftPadding, currentY);
                            ctx.fillText(data.line1, leftPadding, currentY);
                            currentY += lineHeight;
                        }

                        ctx.strokeText(data.line2, leftPadding, currentY);
                        ctx.fillText(data.line2, leftPadding, currentY);
                        currentY += lineHeight;

                        ctx.strokeText(data.line3, leftPadding, currentY);
                        ctx.fillText(data.line3, leftPadding, currentY);
                        currentY += lineHeight;

                        // Truncate address if too long (account for stroke width)
                        const strokeWidth = ctx.lineWidth;
                        const maxWidth = img.width - (leftPadding * 2) - (strokeWidth * 4);
                        let addressText = data.line4;
                        let textWidth = ctx.measureText(addressText).width;

                        // If text is too wide, truncate with ellipsis
                        if (textWidth > maxWidth) {
                            while (textWidth > maxWidth && addressText.length > 0) {
                                addressText = addressText.substring(0, addressText.length - 1);
                                textWidth = ctx.measureText(addressText + '...').width;
                            }
                            addressText += '...';
                        }

                        ctx.strokeText(addressText, leftPadding, currentY);
                        ctx.fillText(addressText, leftPadding, currentY);

                        resolve();
                    };
                    img.onerror = () => reject(new Error("Erreur de chargement de l'image"));
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Store GPS coordinates for EXIF
        let capturedLatitude = 0;
        let capturedLongitude = 0;
        let capturedDateTime = '';

        downloadBtn.addEventListener('click', () => {
            try {
                // Get base64 image from canvas
                const imageDataUrl = mainCanvas.toDataURL('image/jpeg', 0.98);

                // Create EXIF data
                const zeroth = {};
                const exif = {};
                const gps = {};

                // Camera information
                zeroth[piexif.ImageIFD.Make] = "Xiaomi";
                zeroth[piexif.ImageIFD.Model] = "Redmi Note 13 Pro+ 5G";
                zeroth[piexif.ImageIFD.Software] = "PTO Geotag Pro v9.2";

                // Photo settings
                exif[piexif.ExifIFD.FNumber] = [165, 100]; // f/1.65
                exif[piexif.ExifIFD.ExposureTime] = [1, 33]; // 1/33s
                exif[piexif.ExifIFD.ISOSpeedRatings] = 1000;
                exif[piexif.ExifIFD.FocalLength] = [614, 100]; // 6.14mm
                exif[piexif.ExifIFD.FocalLengthIn35mmFilm] = 28; // Equivalent 28mm
                exif[piexif.ExifIFD.Flash] = 1; // Flash fired

                // Date and time
                if (capturedDateTime) {
                    zeroth[piexif.ImageIFD.DateTime] = capturedDateTime;
                    exif[piexif.ExifIFD.DateTimeOriginal] = capturedDateTime;
                    exif[piexif.ExifIFD.DateTimeDigitized] = capturedDateTime;
                }

                // GPS coordinates (if available)
                if (capturedLatitude !== 0 && capturedLongitude !== 0) {
                    // Convert decimal degrees to degrees, minutes, seconds
                    const latDeg = Math.abs(capturedLatitude);
                    const latD = Math.floor(latDeg);
                    const latM = Math.floor((latDeg - latD) * 60);
                    const latS = Math.round(((latDeg - latD) * 60 - latM) * 60 * 100);

                    const lonDeg = Math.abs(capturedLongitude);
                    const lonD = Math.floor(lonDeg);
                    const lonM = Math.floor((lonDeg - lonD) * 60);
                    const lonS = Math.round(((lonDeg - lonD) * 60 - lonM) * 60 * 100);

                    gps[piexif.GPSIFD.GPSLatitudeRef] = capturedLatitude >= 0 ? "N" : "S";
                    gps[piexif.GPSIFD.GPSLatitude] = [[latD, 1], [latM, 1], [latS, 100]];
                    gps[piexif.GPSIFD.GPSLongitudeRef] = capturedLongitude >= 0 ? "E" : "W";
                    gps[piexif.GPSIFD.GPSLongitude] = [[lonD, 1], [lonM, 1], [lonS, 100]];
                }

                // Build EXIF object
                const exifObj = { "0th": zeroth, "Exif": exif, "GPS": gps };
                const exifBytes = piexif.dump(exifObj);

                // Insert EXIF into image
                const newImageDataUrl = piexif.insert(exifBytes, imageDataUrl);

                // Download image with EXIF
                const link = document.createElement('a');
                link.download = fileName;
                link.href = newImageDataUrl;
                link.click();
            } catch (e) {
                console.error("EXIF error:", e);
                // Fallback: download without EXIF if there's an error
                const link = document.createElement('a');
                link.download = fileName;
                link.href = mainCanvas.toDataURL('image/jpeg', 0.98);
                link.click();
                showStatus("⚠️ Photo téléchargée sans métadonnées EXIF", "info");
            }
        });
    </script>

</body>

</html>
